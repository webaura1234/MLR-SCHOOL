<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Malla Reddy School, Medchal">
  <defs>
    <linearGradient id="sealStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D4F2F"/>
      <stop offset="1" stop-color="#A67C1A"/>
    </linearGradient>
  </defs>

  <!-- Seal (left) -->
  <g transform="translate(120,110)">
    <circle r="78" fill="#ffffff" stroke="url(#sealStroke)" stroke-width="6"/>
    <circle r="66" fill="none" stroke="#3D4F2F" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.65"/>

    <!-- Stylized M + cap -->
    <path d="M-30 24V-22L0 8L30 -22V24" stroke="#3D4F2F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-7 -30L0 -38L7 -30M0 -38V-16" stroke="#3D4F2F" stroke-width="3" stroke-linecap="round"/>

    <!-- Seal Text -->
    <path id="sealPath" d="M-52,0 A52,52 0 1,1 52,0" fill="none" />
    <text font-family="Arial, sans-serif" font-size="9.5" font-weight="800" fill="#3D4F2F" letter-spacing="1.2">
      <textPath href="#sealPath" startOffset="50%" text-anchor="middle">MALLA REDDY SCHOOL</textPath>
    </text>
  </g>

  <!-- Wordmark (right) -->
  <g transform="translate(235,0)">
    <text x="0" y="110" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="#1A2314" letter-spacing="1">
      MALLA REDDY SCHOOL
    </text>
    <text x="2" y="158" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#3D4F2F" letter-spacing="4">
      MEDCHAL
    </text>
  </g>
</svg>
